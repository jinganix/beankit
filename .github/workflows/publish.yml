name: Publish

# Publish one package (or every package) via npm Trusted Publishing (OIDC, no tokens).
# Before the first publish of a package, bind it on npmjs.com
# (package Settings > Trusted Publisher) to:
#   organization/user: jinganix, repository: beankit, workflow: publish.yml

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under packages/ (e.g. url-join) or 'all'"
        required: true
        default: "all"

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Gate (typecheck + lint + test)
        run: npm run check

      - name: Build
        run: |
          if [ "${{ inputs.package }}" = "all" ]; then
            npm run build --workspaces --if-present
          else
            npm run build -w packages/${{ inputs.package }}
          fi

      - name: Publish to npm
        run: |
          dirs=$(ls -d packages/*/)
          if [ "${{ inputs.package }}" != "all" ]; then
            dirs="packages/${{ inputs.package }}"
          fi
          for dir in $dirs; do
            dir=${dir%/}
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Unchanged packages keep a version the registry already has; publishing
            # it again only aborts the loop before the bumped packages are reached.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish -w "$dir" --provenance --access public
          done
